name: Verify

"on":
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Deterministic verification
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: "true"
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js 22.13.0
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22.13.0"
          check-latest: false

      - name: Set up pnpm 11.19.0
        uses: pnpm/setup@5d160c5bc68a09337ad0d5654e237e03253b5879 # v1.0.0
        with:
          version: "11.19.0"
          install: false
          cache: false

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify JavaScript and TypeScript
        run: pnpm verify

      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          check-latest: false

      - name: Set up uv 0.10.12
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: "0.10.12"
          enable-cache: false

      - name: Test the media service
        working-directory: services/media
        run: |
          uv venv .venv --python 3.12
          uv sync --locked
          source .venv/bin/activate
          pytest -q
